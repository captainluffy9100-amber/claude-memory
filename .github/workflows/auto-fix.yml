name: AI Auto-Fix

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  auto-fix:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Run Claude Code to fix tests
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
          ANTHROPIC_MODEL: ${{ secrets.ANTHROPIC_MODEL }}
        run: |
          claude --print --allowedTools "Read,Edit,Bash" \
            "The CI pipeline just failed. Run 'python -m pytest tests/ -v --tb=short' to see the failures, \
            then fix the code so all tests pass. Only make minimal, targeted changes. \
            Do not refactor or change unrelated code." \
            > fix.log 2>&1 || true

      - name: Run tests to verify fix
        id: verify
        run: |
          if python -m pytest tests/ -v --tb=short; then
            echo "fixed=true" >> $GITHUB_OUTPUT
          else
            echo "fixed=false" >> $GITHUB_OUTPUT
          fi

      - name: Create fix PR
        if: steps.verify.outputs.fixed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "fix: AI auto-fix for failing CI tests"
          branch: auto-fix/ci-failure
          title: "AI Auto-Fix: repair failing tests"
          body: |
            The **CI pipeline failed** and this PR was auto-generated by Claude Code to fix the test failures.

            Please review the changes carefully before merging.
          labels: automated, ai-fix
